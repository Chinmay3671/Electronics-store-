spring:
  datasource:
    url: jdbc:h2:mem:techvault_dev;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

app:
  jwt:
    secret: TechVaultUltraSecureSuperSecretKeyThatIsAtLeast256BitsLongForHMACSHA256EnterpriseGrade2025
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  cors:
    allowed-origins: "*"
